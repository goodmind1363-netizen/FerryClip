<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>body{margin:0;background:#faf5e8;color:#13294b;font:16px/1.5 system-ui,sans-serif}header{background:#13294b;border-bottom:3px solid #c9a227;color:#e8c964;padding:16px 20px;font-weight:800;font-size:20px;display:flex;justify-content:space-between}main{max-width:760px;margin:24px auto;padding:0 18px}.box{background:#fffdf7;border:1px solid #e6d9b3;border-radius:14px;padding:20px;margin-bottom:20px}input,textarea{width:100%;font:inherit;padding:10px;border:1px solid #e6d9b3;border-radius:8px;margin:6px 0 12px}textarea{min-height:200px}button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:9px 18px;cursor:pointer;background:#c9a227;color:#0c1b33}button.s{background:#13294b;color:#e8c964;padding:6px 12px}.r{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #e6d9b3}.r span{flex:1}#ip{max-width:100%;border-radius:10px;margin:0 0 10px;display:none}</style></head><body>
<header><span>◆ Ferryclip Admin</span><button class="s" id="so" style="display:none" onclick="logout()">Sign out</button></header>
<main>
<div class="box" id="lg" style="display:none"><h2 style="margin-top:0">Sign in</h2><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div id="cf"></div><button onclick="login()">Sign in</button><p id="lm"></p></div>
<div id="ap" style="display:none">
<div class="box"><h2 id="h" style="margin-top:0">New post</h2><label>Title</label><input id="t"><label>Publish date (a future date schedules the post)</label><input id="d" type="date"><label>Image (optional, resized automatically)</label><img id="ip" alt=""><input id="im2" type="file" accept="image/*" onchange="pick()"><button class="s" onclick="noImg()">Remove image</button><label style="margin-top:12px">Content</label><textarea id="b"></textarea><button onclick="save()">Publish</button> <button class="s" onclick="reset()">Clear</button><p id="m"></p></div>
<div class="box"><h2 style="margin-top:0">Import posts</h2><p>Choose a .json file with a list of posts. Posts whose title already exists are skipped.</p><input id="im" type="file" accept=".json,application/json"><label>Publish one post every N days (0 = all today)</label><input id="gap" type="number" min="0" value="0"><button onclick="importPosts()">Import</button><p id="io"></p></div>
<div class="box"><h2 style="margin-top:0">All posts</h2><div id="l"></div></div>
</div></main>
<script>
const A="/api/admin/posts",J={"Content-Type":"application/json"};let L=[],eid=null,tsId=null,IMG;const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function view(on){$("lg").style.display=on?"none":"block";$("ap").style.display=on?"block":"none";$("so").style.display=on?"inline-block":"none"}
async function load(){const r=await fetch(A);if(!r.ok){view(false);return}view(true);L=await r.json();$("l").innerHTML=L.map(p=>`<div class="r"><span>${esc(p.title)} <small>(${p.date}${p.date>today()?" - scheduled":""}${p.img?" - image":""})</small></span><button class="s" onclick="edit(${p.id})">Edit</button><button class="s" onclick="del(${p.id})">Delete</button></div>`).join("")||"No posts yet."}
async function initTs(){try{const c=await(await fetch("/api/config")).json();if(!c.tsKey)return;await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";s.onload=ok;s.onerror=no;document.head.appendChild(s)});tsId=turnstile.render("#cf",{sitekey:c.tsKey})}catch(e){}}
async function login(){$("lm").textContent="Checking...";const r=await fetch("/api/admin/login",{method:"POST",headers:J,body:JSON.stringify({password:$("pw").value,ts:tsId!==null?turnstile.getResponse(tsId):""})});if(r.ok){$("pw").value="";$("lm").textContent="";load()}else{$("lm").textContent=await r.text();if(tsId!==null)turnstile.reset(tsId)}}
function shot(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const W=1200,H=630,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d"),s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",0.72))};im.onerror=()=>no();im.src=u})}
async function pick(){const f=$("im2").files[0];if(!f)return;try{IMG=await shot(f);$("ip").src=IMG;$("ip").style.display="block"}catch(e){$("m").textContent="Could not read this image."}}
function noImg(){IMG="";$("im2").value="";$("ip").style.display="none"}
async function importPosts(){const f=$("im").files[0],o=$("io");if(!f){o.textContent="Choose a .json file first.";return}
let a;try{a=JSON.parse(await f.text())}catch(e){o.textContent="This file is not valid JSON.";return}
if(!Array.isArray(a)){o.textContent="Expected a list of posts.";return}
const gap=parseInt($("gap").value)||0,have=new Set(L.map(p=>p.title));let n=0,s=0;
for(const p of a){if(!p||!p.title||!p.body)continue;if(have.has(p.title)){s++;continue}
o.textContent="Importing "+(n+s+1)+" of "+a.length+"...";
const date=p.date||new Date(Date.now()+n*gap*864e5).toISOString().slice(0,10);
const r=await fetch(A,{method:"POST",headers:J,body:JSON.stringify({title:p.title,body:p.body,date})});
if(!r.ok){o.textContent="Stopped at \""+p.title+"\" (error "+r.status+")";return}
n++;have.add(p.title)}
o.textContent="Done: "+n+" added, "+s+" skipped (already exist).";load()}
async function logout(){await fetch("/api/admin/login",{method:"DELETE"});view(false)}
function edit(id){const p=L.find(x=>x.id==id);eid=id;IMG=undefined;$("t").value=p.title;$("b").value=p.body;$("d").value=p.date;$("im2").value="";if(p.img){$("ip").src="/api/img?id="+id+"&v="+Date.now();$("ip").style.display="block"}else $("ip").style.display="none";$("h").textContent="Edit post";scrollTo(0,0)}
function reset(){eid=null;IMG=undefined;$("t").value=$("b").value="";$("d").value=today();$("im2").value="";$("ip").style.display="none";$("h").textContent="New post"}
async function save(){const body={title:$("t").value,body:$("b").value,date:$("d").value||today()};if(IMG!==undefined)body.image=IMG;const r=await fetch(eid?A+"?id="+eid:A,{method:eid?"PUT":"POST",headers:J,body:JSON.stringify(body)});$("m").textContent=r.ok?"Saved.":"Error: "+r.status+" "+await r.text();if(r.ok){reset();load()}}
async function del(id){if(confirm("Delete this post?")){await fetch(A+"?id="+id,{method:"DELETE"});load()}}
$("d").value=today();initTs();load();
</script></body></html>
