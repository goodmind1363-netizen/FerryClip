<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>body{margin:0;background:#faf5e8;color:#13294b;font:16px/1.5 system-ui,sans-serif}header{background:#13294b;border-bottom:3px solid #c9a227;color:#e8c964;padding:16px 20px;font-weight:800;font-size:20px}main{max-width:760px;margin:24px auto;padding:0 18px}.box{background:#fffdf7;border:1px solid #e6d9b3;border-radius:14px;padding:20px;margin-bottom:20px}input,textarea{width:100%;font:inherit;padding:10px;border:1px solid #e6d9b3;border-radius:8px;margin:6px 0 12px}textarea{min-height:200px}button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:9px 18px;cursor:pointer;background:#c9a227;color:#0c1b33}button.s{background:#13294b;color:#e8c964;padding:6px 12px}.r{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #e6d9b3}.r span{flex:1}</style></head><body>
<header>◆ Ferryclip Admin</header><main><div class="box"><h2 id="h" style="margin-top:0">New post</h2><label>Title</label><input id="t"><label>Content</label><textarea id="b"></textarea><button onclick="save()">Publish</button> <button class="s" onclick="reset()">Clear</button><p id="m"></p></div>
<div class="box"><h2 style="margin-top:0">All posts</h2><div id="l"></div></div></main>
<script>
const A="/api/admin/posts";let L=[],eid=null;const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){const r=await fetch(A);if(!r.ok){$("l").textContent="Access denied.";return}L=await r.json();$("l").innerHTML=L.map(p=>`<div class="r"><span>${esc(p.title)} <small>(${p.date})</small></span><button class="s" onclick="edit(${p.id})">Edit</button><button class="s" onclick="del(${p.id})">Delete</button></div>`).join("")||"No posts yet."}
function edit(id){const p=L.find(x=>x.id==id);eid=id;$("t").value=p.title;$("b").value=p.body;$("h").textContent="Edit post";scrollTo(0,0)}
function reset(){eid=null;$("t").value=$("b").value="";$("h").textContent="New post"}
async function save(){const r=await fetch(eid?A+"?id="+eid:A,{method:eid?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("t").value,body:$("b").value})});$("m").textContent=r.ok?"Saved.":"Error: "+r.status;if(r.ok){reset();load()}}
async function del(id){if(confirm("Delete this post?")){await fetch(A+"?id="+id,{method:"DELETE"});load()}}
load();
</script></body></html>
